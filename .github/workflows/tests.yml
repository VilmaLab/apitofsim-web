name: Tests (end-to-end)

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:

  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6

  playwright:
    name: Playwright end-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Cache test database
        uses: actions/cache@v4
        with:
          path: |
            datasets/database_test.duckdb
            datasets/database_test.ase.sqlite.db
          key: test-dbs-${{ hashFiles('datasets/datasets_test.toml') }}

      - name: Set up environment
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Install project and test dependencies
        run: uv sync --all-groups --all-extras

      - name: Install Chromium
        run: .venv/bin/playwright install --with-deps chromium

      - name: Run tests
        # Use the installed environment directly so Ray workers reuse it.
        run: .venv/bin/pytest -v

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            tests/server.log
            test-results/
          if-no-files-found: ignore
