name: Publish container

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/container.yml
      - .dockerignore
      - Dockerfile
      - README.md
      - fetch-and-start.sh
      - package.json
      - package-lock.json
      - pyproject.toml
      - src/**
      - tsconfig.json
      - uv.lock
  workflow_dispatch:

concurrency:
  group: publish-container-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vilmalab/apitofsim-web
  CACHE: ghcr.io/vilmalab/apitofsim-web-buildcache:main

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: type=registry,ref=${{ env.CACHE }},mode=max
          # Rahti expects a single Docker-format image manifest.
          outputs: type=image,push=true,oci-mediatypes=false
          provenance: false
          sbom: false

      - name: Record published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Published `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
