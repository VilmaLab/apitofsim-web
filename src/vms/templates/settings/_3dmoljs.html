{% macro cluster_3dmol(cluster, format, width, height, viewer_id, show_atom_indices=False) -%}
    <div id="{{ viewer_id }}" style="width: min(100%, {{ width }}px); aspect-ratio: {{ width }} / {{ height }};"></div>
    <script>
        (function() {
            let element = document.getElementById("{{ viewer_id }}");
            let viewer = $3Dmol.createViewer(element, {
                backgroundColor: "white"
            });
            let molblock = `{{ cluster }}`;
            viewer.addModel(molblock, "{{ format }}");
            viewer.setStyle({}, {stick:{}});
            {% if show_atom_indices %}
                viewer.addPropertyLabels("index",{not:{elem:'H'}}, {
                    fontColor:'black',
                    font:'sans-serif',
                    fontSize: 15,
                    showBackground:false,
                    alignment:'center'
                });
            {% endif %}
            viewer.zoomTo();
            viewer.render();
            new ResizeObserver(() => {
                if (element.clientWidth && element.clientHeight) {
                    viewer.resize();
                    viewer.render();
                }
            }).observe(element);
        })();
    </script>
{%- endmacro %}
