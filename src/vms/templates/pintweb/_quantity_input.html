<div
    x-data="quantityinput({
        'system': {{ unit_system|escape }},
        'magnitude': {{ magnitude }},
        'unit': '{{ unit }}',
        'viewUnit': '{{ view_unit }}'
    })"
    {{ wrapper_params }}
    @unit-change="unitChange($event.detail)"
    @quantity-reset="reset($event.detail)"
>
    <input
        x-ref="quantityValue"
        :value="viewValue"
        @input="input($event)"
        type="text"
        inputmode="numeric"
        {{ container_params }}>
    {% if unit_select %}
        {% include "pintweb/_unit_select.html" %}
    {% else %}
        {% include "pintweb/_unit_cycle.html" %}
    {% endif %}
    <input type="hidden" name="{{ name }}" :value="inputValue + ' ' + inputUnit">
    <input type="hidden" name="{{ name }}-view-unit" :value="viewUnit">
</div>
