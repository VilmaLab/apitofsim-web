<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="responsive-embedded-sizing" content="allow-origins=*">
    <script src="{{ url_for('static', path='/index.js') }}" defer></script>
    <title>{% block title %}{% endblock %}</title>
    <style>
        @import "{{ url_for('static', path='/index.css') }}";
        input[type=range].vertical {
            writing-mode: vertical-lr;
            direction: rtl;
            vertical-align: middle;
        }
        .icon {
            width: 2em;
            height: 2em;
            vertical-align: -0.125em;
            overflow: visible;
        }
        .loader-queue {
            aspect-ratio: 5;
            background: radial-gradient(closest-side at 37.5% 50%,#000 94%,#0000) 0/calc(80%/3) 100%;
            animation: l47 .75s infinite;
        }
        @keyframes l47 {
            100% {background-position: 36.36%}
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
