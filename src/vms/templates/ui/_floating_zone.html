{% macro floating_zone(name, label) %}
<div class="floating-zone {{ name }}-zone"
     x-data="{ pinned: false, hovered: false, focused: false }"
     :data-open="String(pinned || hovered || focused)"
     @pointerenter="if ($event.pointerType == 'mouse') hovered = true"
     @pointerleave="hovered = false"
     @focusin="focused = $event.target !== $refs.toggle"
     @focusout="if (!$el.contains($event.relatedTarget)) focused = false"
     @click.outside="pinned = false"
     @keydown.escape.stop="pinned = hovered = focused = false; $refs.toggle.focus()">
    <button type="button" x-ref="toggle" class="zone-toggle cursor-pointer bg-gray-50 rounded-lg p-3 shadow"
            aria-label="{{ label }}" aria-controls="{{ name }}-panel"
            :aria-expanded="String(pinned || hovered || focused)" @click="pinned = !pinned">
        <svg aria-hidden="true" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div id="{{ name }}-panel" class="zone-panel"
         @click="if ($event.target.closest('a')) pinned = hovered = focused = false">
        {{ caller() }}
    </div>
</div>
{% endmacro %}
