[project]
name = "vms"
version = "0.0.1"
description = "Web interface to APi-ToF mass spectrometer simulator code"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apitofsim",
    "anyio>=4.14.2",
    "ase>=3.26.0",
    "duckdb>=1.4.1",
    "holoviews>=1.21.0",
    "lxml>=6.0.2",
    "matplotlib>=3.10.6",
    "minify-html-onepass>=0.16.4",
    "molify>=0.2.1",
    "pint>=0.25",
    "pip>=25.2",
    "quart>=0.20.0",
    "quart-wtforms>=1.0.3",
    "ray[default]>=2.58.0",
    "rdkit>=2025.9.1",
    "virtualenv>=20.34.0",
    "wtforms>=3.2.1",
    "sympy>=1.14.0",
    "apitofsim-resultviewer",
]

[project.optional-dependencies]
deploy = [
    "hypercorn>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
apitofsim = [
  { url = "https://github.com/VilmaLab/apitofsim/releases/download/v0.0.16/apitofsim-0.0.16-cp313-abi3-manylinux_2_34_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { url = "https://github.com/VilmaLab/apitofsim/releases/download/v0.0.16/apitofsim-0.0.16-cp313-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
  { url = "https://github.com/VilmaLab/apitofsim/releases/download/v0.0.16/apitofsim-0.0.16-cp313-abi3-win_amd64.whl", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
  # Fallback for platforms outside [tool.uv] environments: every source in a
  # list needs a marker and uv's parser has no `not`, so the complement has to
  # be written with De Morgan (or the sdist used as the only source).
  # { url = "https://github.com/VilmaLab/apitofsim/archive/refs/tags/v0.0.16.tar.gz", marker = "(sys_platform != 'linux' or platform_machine != 'x86_64') and (sys_platform != 'darwin' or platform_machine != 'arm64') and (sys_platform != 'win32' or platform_machine != 'AMD64')" },
]
apitofsim-resultviewer = { git = "https://github.com/VilmaLab/apitofsim-resultviewer.git" }
