[project]
name = "vms"
version = "0.0.1"
description = "Web interface to APi-ToF mass spectrometer simulator code"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apitofsim",
    "anyio>=4.14.2",
    "ase>=3.26.0",
    "duckdb>=1.4.1",
    "holoviews>=1.21.0",
    "jinja2>=3.1.6",
    "lxml>=6.0.2",
    "matplotlib>=3.10.6",
    "minify-html-onepass>=0.16.4",
    "molify>=0.2.1",
    "pint>=0.25",
    "pip>=25.2",
    "starlette>=1.4.1",
    "starlette-wtf>=0.4.5",
    "ray[default]>=2.58.0",
    "rdkit>=2025.9.1",
    "virtualenv>=20.34.0",
    "wtforms>=3.2.1",
    "sympy>=1.14.0",
    "uvicorn>=0.52.1",
    "apitofsim-resultviewer",
    "markdown>=3.10.2",
    "workingtitle[devserver]",
]

[project.optional-dependencies]
deploy = [
    "uvicorn>=0.52.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[tool.uv]
# Resultviewer declares older wheel URLs; use the web app's simulation version.
override-dependencies = ["apitofsim[plot]"]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
# Development pin for the public runner API; replace with a release before merging.
apitofsim = { git = "https://github.com/VilmaLab/apitofsim.git", rev = "f2066dc18bced4b7a59f3243b783b29cd9b4348a" }
apitofsim-resultviewer = { git = "https://github.com/VilmaLab/apitofsim-resultviewer.git", rev = "dcd679f7f0c4cc6da047086bace354f056a04ba4" }
workingtitle = { git = "https://github.com/frankier/workingtitle.git" }
